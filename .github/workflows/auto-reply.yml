name: Check email and auto-reply

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: scammer-auto-reply
  cancel-in-progress: false

jobs:
  check-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BOT_ENABLED: ${{ secrets.BOT_ENABLED }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
      LOG_CONTENT: "false"
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
      IGNORE_BEFORE_UTC: ${{ secrets.IGNORE_BEFORE_UTC }}
      TARGET_SUBJECT_CONTAINS: ${{ secrets.TARGET_SUBJECT_CONTAINS }}
      TARGET_EMAIL_CONTAINS: ${{ secrets.TARGET_EMAIL_CONTAINS }}
      MAX_REPLIES_PER_DAY: ${{ secrets.MAX_REPLIES_PER_DAY }}
      MAX_TOTAL_REPLIES: ${{ secrets.MAX_TOTAL_REPLIES }}
      AI_PROVIDER_ORDER: "gemini,groq"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: "gemini-2.5-flash"
      GEMINI_TEMPERATURE: "0.8"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"
      GROQ_TEMPERATURE: "0.8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check mailbox once
        run: python run_once.py
